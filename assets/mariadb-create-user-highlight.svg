<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="370" viewBox="0 0 1260 370"><rect width="1260" height="370" rx="12" fill="#f6f8fa"/><g font-family="monospace" font-size="23" fill="#17202a"><text x="24" y="50">CREATE DATABASE ragnarok CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;</text><text x="24" y="95">CREATE DATABASE ragnarok_log CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;</text><text x="24" y="140">CREATE USER '<tspan fill="#0057b8" font-weight="bold" font-style="italic">YOUR_DB_USER</tspan>'@'localhost' IDENTIFIED BY '<tspan fill="#c21b30" font-weight="bold" font-style="italic">YOUR_DB_PASSWORD</tspan>';</text><text x="24" y="185">GRANT ALL PRIVILEGES ON ragnarok.* TO '<tspan fill="#0057b8" font-weight="bold" font-style="italic">YOUR_DB_USER</tspan>'@'localhost';</text><text x="24" y="230">GRANT ALL PRIVILEGES ON ragnarok_log.* TO '<tspan fill="#0057b8" font-weight="bold" font-style="italic">YOUR_DB_USER</tspan>'@'localhost';</text><text x="24" y="275">FLUSH PRIVILEGES;</text><text x="24" y="337"><tspan fill="#0057b8" font-weight="bold" font-style="italic">YOUR_DB_USER</tspan> = username / <tspan fill="#c21b30" font-weight="bold" font-style="italic">YOUR_DB_PASSWORD</tspan> = password</text></g></svg>
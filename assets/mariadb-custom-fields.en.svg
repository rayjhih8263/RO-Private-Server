<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="white"/><g font-family="sans-serif" fill="#17202a"><text x="35" y="50" font-size="28" font-weight="bold">MariaDB field guide (explanatory diagram)</text><g fill="none" stroke="#d71920" stroke-width="4"><rect x="25" y="78" width="950" height="135" rx="8"/><rect x="25" y="232" width="950" height="152" rx="8"/><rect x="25" y="403" width="950" height="204" rx="8"/></g><g font-size="22"><text x="48" y="117" font-weight="bold">Service Name: MariaDB (customizable)</text><text x="48" y="155">For example, RODatabase. This is the Windows service name.</text><text x="48" y="191">Separate from the in-game server name and database username.</text><text x="48" y="273" font-weight="bold">TCP port: 3306 (recommended default)</text><text x="48" y="313">The default port for MariaDB / MySQL.</text><text x="48" y="353">If changed, update the server database connection ports as well.</text><text x="48" y="445" font-weight="bold">CREATE USER: choose your database username</text><text x="48" y="485">YOUR_DB_USER → your username, for example ro_user</text><text x="48" y="525">YOUR_DB_PASSWORD → your password</text><text x="48" y="565">Use the same username in CREATE USER, both GRANTs and server settings.</text></g></g></svg>
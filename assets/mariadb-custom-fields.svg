<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="white"/><g font-family="sans-serif" fill="#17202a"><text x="35" y="50" font-size="28" font-weight="bold">MariaDB 欄位說明（整理圖）</text><g fill="none" stroke="#d71920" stroke-width="4"><rect x="25" y="78" width="950" height="135" rx="8"/><rect x="25" y="232" width="950" height="152" rx="8"/><rect x="25" y="403" width="950" height="204" rx="8"/></g><g font-size="25"><text x="48" y="117" font-weight="bold">Service Name：MariaDB（可自訂）</text><text x="48" y="155">例如 RODatabase；這是 Windows 服務名稱。</text><text x="48" y="191">不是遊戲內的 Server 名稱，也不是資料庫帳號。</text><text x="48" y="273" font-weight="bold">TCP port：3306（建議保留）</text><text x="48" y="313">MariaDB／MySQL 的預設連接埠。</text><text x="48" y="353">若改用其他 Port，Server 資料庫連線設定也要一起改。</text><text x="48" y="445" font-weight="bold">CREATE USER：資料庫帳號可自訂</text><text x="48" y="485">YOUR_DB_USER → 自己的帳號，例如 ro_user</text><text x="48" y="525">YOUR_DB_PASSWORD → 自己的密碼</text><text x="48" y="565">CREATE USER、兩行 GRANT、Server 設定須用相同帳號。</text></g></g></svg>